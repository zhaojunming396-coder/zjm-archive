<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#34c759">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="训练助手">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <title>训练记录</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        color-scheme: dark;
        --bg: #0f1411;
        --surface: #171f1a;
        --surface-2: #202a24;
        --text: #f4f7f2;
        --muted: #a8b3aa;
        --line: #2f3c34;
        --accent: #34c759;
        --accent-strong: #21a447;
        --warning: #ffb020;
        --danger: #ff6b6b;
      }

      html,
      body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
      }

      nav {
        position: sticky;
        top: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        width: 100%;
        max-width: 480px;
        margin: 0 auto 16px;
        padding: 10px 16px;
        background: rgba(15, 20, 17, 0.96);
        border-bottom: 1px solid var(--line);
      }

      nav a {
        min-width: 0;
        color: var(--muted);
        text-align: center;
        text-decoration: none;
        font-size: 12px;
        padding: 9px 4px;
        border-radius: 10px;
        background: var(--surface);
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        font-size: 26px;
        line-height: 1.18;
        margin-bottom: 10px;
      }

      h2 {
        font-size: 22px;
        line-height: 1.25;
        margin-bottom: 8px;
      }

      h3 {
        font-size: 17px;
        margin-bottom: 8px;
      }

      p,
      li,
      summary,
      label,
      span {
        color: var(--muted);
      }

      strong {
        color: var(--text);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
        max-width: 100%;
        min-width: 0;
      }

      button {
        min-height: 46px;
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        color: #06120a;
        background: var(--accent);
        font-weight: 700;
        font-size: 16px;
        touch-action: manipulation;
      }

      .secondary-button {
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--line);
      }

      button:disabled {
        opacity: 0.45;
      }

      input,
      select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        color: var(--text);
        background: var(--surface-2);
        font-size: 16px;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 86px;
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
        color: var(--text);
        background: var(--surface-2);
        font-size: 16px;
      }

      .page,
      .exercise,
      .history-item,
      .hero-card,
      .meta-card,
      .stat-grid,
      .stat-item,
      .target-grid,
      .target-pill,
      .last-record,
      .bar-list,
      .bar-row,
      .bar-track,
      .actions,
      .set-row,
      .sticky-actions {
        max-width: 100%;
        min-width: 0;
      }

      .exercise,
      .history-item {
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 16px;
        margin-bottom: 14px;
        background: var(--surface);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
      }

      .page {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        border: 0;
        padding: 0 16px 20px;
        overflow-x: hidden;
        background: transparent;
        box-shadow: none;
      }

      .meta-card {
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px;
        background: var(--surface-2);
        margin-bottom: 12px;
      }

      .record-header {
        padding: 4px 0 8px;
      }

      .record-header h1,
      .record-header p {
        margin-bottom: 4px;
      }

      .training-status-card {
        position: sticky;
        top: 72px;
        z-index: 1;
        display: grid;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 12px;
        margin-bottom: 12px;
        background: rgba(23, 31, 26, 0.96);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
      }

      .training-status-header,
      .training-status-rest {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .training-status-header strong {
        font-size: 20px;
      }

      .training-status-header span,
      .training-status-rest span {
        font-size: 13px;
      }

      .training-status-progress {
        margin: 0;
      }

      .training-status-rest button {
        flex: 0 0 auto;
      }

      .exercise-switcher {
        display: grid;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px;
        margin-bottom: 12px;
        background: var(--surface);
      }

      .exercise-switcher-status {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .exercise-switcher-status strong {
        flex: 0 0 auto;
      }

      .exercise-switcher-status span {
        text-align: right;
        font-size: 13px;
      }

      .exercise-switcher-controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .compact-details {
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }

      .compact-details > summary {
        min-height: 34px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }

      .hero-card {
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 18px;
        margin-bottom: 14px;
        background: linear-gradient(180deg, #1d2921 0%, var(--surface) 100%);
      }

      .eyebrow {
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .muted {
        color: var(--muted);
      }

      .big-value {
        color: var(--text);
        font-size: 30px;
        line-height: 1.15;
        font-weight: 800;
        margin-bottom: 8px;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 12px 0;
      }

      .stat-item {
        min-width: 0;
        border-radius: 14px;
        padding: 12px;
        background: var(--surface-2);
      }

      .stat-label {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .stat-value {
        display: block;
        color: var(--text);
        font-size: 18px;
        font-weight: 750;
        word-break: break-word;
      }

      .exercise-title {
        color: var(--text);
        margin-bottom: 2px;
      }

      .exercise-subtitle {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 10px;
      }

      .target-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 10px 0;
      }

      .target-pill {
        border-radius: 12px;
        padding: 9px 10px;
        background: var(--surface-2);
      }

      .last-record {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        margin: 8px 0;
        background: rgba(52, 199, 89, 0.08);
      }

      .recommendation-card {
        max-width: 100%;
        min-width: 0;
        border: 1px solid rgba(255, 176, 32, 0.38);
        border-radius: 14px;
        padding: 12px;
        margin: 8px 0;
        background: rgba(255, 176, 32, 0.1);
      }

      .exercise-guidance {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0;
        margin: 10px 0 14px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .guidance-block {
        display: grid;
        align-content: start;
        gap: 3px;
        min-width: 0;
        padding: 11px 10px 11px 0;
      }

      .guidance-today {
        border-left: 1px solid var(--line);
        padding-right: 0;
        padding-left: 12px;
      }

      .guidance-label,
      .guidance-block > span {
        font-size: 12px;
      }

      .guidance-block > strong {
        font-size: 20px;
        line-height: 1.25;
      }

      .guidance-strategy {
        width: fit-content;
        margin-top: 4px;
        border-radius: 999px;
        padding: 3px 8px;
        color: #06120a;
        background: var(--warning);
        font-weight: 750;
      }

      .guidance-reason {
        grid-column: 1 / -1;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }

      .guidance-reason > summary {
        min-height: 32px;
        font-size: 13px;
        font-weight: 700;
      }

      .guidance-reason p {
        margin: 2px 0 4px;
        font-size: 13px;
      }

      .feedback-card {
        border: 1px solid rgba(52, 199, 89, 0.36);
        border-radius: 20px;
        padding: 16px;
        margin-bottom: 14px;
        background: linear-gradient(180deg, rgba(52, 199, 89, 0.14) 0%, var(--surface) 100%);
      }

      .feedback-card h2 {
        margin-bottom: 8px;
      }

      .feedback-card p {
        margin-bottom: 8px;
      }

      .feedback-baseline {
        border-color: rgba(255, 176, 32, 0.42);
        background: linear-gradient(180deg, rgba(255, 176, 32, 0.14) 0%, var(--surface) 100%);
      }

      .feedback-reduce {
        border-color: rgba(255, 107, 107, 0.42);
        background: linear-gradient(180deg, rgba(255, 107, 107, 0.14) 0%, var(--surface) 100%);
      }

      .feedback-maintain,
      .feedback-recovery,
      .feedback-catch_up {
        border-color: rgba(86, 154, 255, 0.34);
        background: linear-gradient(180deg, rgba(86, 154, 255, 0.12) 0%, var(--surface) 100%);
      }

      .feedback-label {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        border-radius: 999px;
        padding: 4px 10px;
        margin-bottom: 10px;
        color: #06120a;
        background: var(--accent);
        font-size: 12px;
        font-weight: 800;
      }

      .feedback-baseline .feedback-label {
        background: var(--warning);
        color: #1a1000;
      }

      .feedback-reduce .feedback-label {
        background: var(--danger);
        color: #1f0707;
      }

      .feedback-maintain .feedback-label,
      .feedback-recovery .feedback-label,
      .feedback-catch_up .feedback-label {
        color: var(--text);
        background: #2b5f9e;
      }

      .feedback-evidence {
        color: var(--text);
        font-size: 13px;
      }

      .feedback-progress {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: var(--surface);
        overflow: hidden;
      }

      .feedback-progress span {
        display: block;
        min-width: 8px;
        max-width: 100%;
        height: 100%;
        border-radius: 999px;
        background: var(--accent);
      }

      .compact-card {
        padding-bottom: 14px;
      }

      .feedback-list {
        display: grid;
        gap: 10px;
      }

      .feedback-row {
        display: grid;
        gap: 7px;
        border: 1px solid transparent;
        border-radius: 14px;
        padding: 12px;
        background: var(--surface-2);
      }

      .feedback-row-progress {
        border-color: rgba(52, 199, 89, 0.38);
        background: rgba(52, 199, 89, 0.1);
      }

      .feedback-row-maintain {
        border-color: rgba(86, 154, 255, 0.34);
        background: rgba(86, 154, 255, 0.09);
      }

      .feedback-row-baseline {
        border-color: rgba(255, 176, 32, 0.38);
        background: rgba(255, 176, 32, 0.1);
      }

      .feedback-row-reduce {
        border-color: rgba(255, 107, 107, 0.42);
        background: rgba(255, 107, 107, 0.1);
      }

      .feedback-row-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .feedback-row-head span {
        flex: 0 0 auto;
        border-radius: 999px;
        padding: 3px 8px;
        color: var(--text);
        background: rgba(244, 247, 242, 0.1);
        font-size: 12px;
        font-weight: 750;
      }

      .feedback-row span {
        font-size: 13px;
      }

      .feedback-row p,
      .feedback-row small {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .feedback-row p {
        color: var(--text);
      }

      .feedback-row small {
        display: block;
        border-top: 1px solid rgba(244, 247, 242, 0.1);
        padding-top: 7px;
      }

      .last-record p,
      .last-record ul,
      .recommendation-card p {
        margin-bottom: 0;
      }

      .bar-list {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .bar-row {
        display: grid;
        grid-template-columns: minmax(72px, 0.8fr) minmax(0, 1.4fr) minmax(70px, 0.8fr);
        align-items: center;
        gap: 8px;
      }

      .bar-track {
        height: 10px;
        border-radius: 999px;
        background: var(--surface-2);
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--accent);
      }

      .history-item {
        cursor: pointer;
      }

      .warmup-list,
      ol,
      ul {
        padding-left: 20px;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }

      .actions button {
        flex: 1 1 130px;
      }

      .source-line {
        color: var(--accent);
        font-weight: 700;
      }

      .restore-auto-button {
        width: 100%;
        margin-top: 12px;
        color: #06120a;
        background: var(--warning);
      }

      .planner-card {
        display: grid;
        gap: 12px;
      }

      .planner-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
      }

      .planner-header h2,
      .planner-header p {
        margin-bottom: 4px;
      }

      .planner-list {
        display: grid;
        gap: 8px;
      }

      .planner-row {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px;
        background: var(--surface-2);
      }

      .planner-row strong {
        min-width: 0;
        word-break: break-word;
      }

      .planner-order {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 999px;
        color: #06120a;
        background: var(--accent);
        font-size: 14px;
        font-weight: 800;
      }

      .planner-controls {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 46px 46px minmax(0, 1fr);
        gap: 8px;
      }

      .planner-position {
        grid-column: 1 / -1;
      }

      .icon-button {
        width: 46px;
        min-height: 42px;
        padding: 8px;
        font-size: 18px;
        line-height: 1;
      }

      .compact-button {
        min-height: 42px;
        padding: 8px 10px;
        font-size: 14px;
      }

      .planner-add-grid {
        display: grid;
        gap: 8px;
      }

      .set-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 12px 0;
        padding: 12px;
        border-radius: 14px;
        background: var(--surface-2);
      }

      .set-row-error {
        border: 1px solid rgba(255, 107, 107, 0.72);
        background: rgba(255, 107, 107, 0.08);
      }

      .set-title,
      .set-completed,
      .set-complete-button,
      .set-error-text {
        grid-column: 1 / -1;
      }

      .set-title {
        color: var(--text);
        font-size: 16px;
        font-weight: 750;
      }

      .field-label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .rir-picker {
        grid-column: 1 / -1;
        display: grid;
        gap: 8px;
      }

      .rir-picker-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .rir-picker-heading span {
        text-align: right;
        font-size: 12px;
      }

      .rir-options {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }

      .rir-option {
        display: grid;
        place-items: center;
        gap: 1px;
        min-height: 52px;
        padding: 5px 2px;
        color: var(--muted);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .rir-option strong {
        color: inherit;
        font-size: 16px;
        line-height: 1.1;
      }

      .rir-option span {
        color: inherit;
        font-size: 10px;
        line-height: 1.1;
      }

      .rir-option.active {
        color: #06120a;
        background: var(--accent);
        border-color: var(--accent);
      }

      .set-completed {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
      }

      .set-completed input {
        width: 22px;
        min-height: 22px;
      }

      .set-complete-button {
        width: 100%;
        min-height: 48px;
      }

      .set-complete-button-done {
        color: #06120a;
        background: var(--accent);
      }

      .set-error-text {
        margin: -2px 0 0;
        color: var(--danger);
        font-size: 13px;
        line-height: 1.45;
      }

      .notice {
        color: var(--danger);
        background: rgba(255, 107, 107, 0.12);
        border: 1px solid rgba(255, 107, 107, 0.28);
        border-radius: 12px;
        padding: 10px;
      }

      .success-notice {
        color: var(--accent);
        background: rgba(52, 199, 89, 0.12);
        border-color: rgba(52, 199, 89, 0.3);
        margin-bottom: 12px;
      }

      .notice ul {
        margin: 8px 0 0;
      }

      .choice-grid {
        display: grid;
        gap: 10px;
      }

      .choice-button {
        width: 100%;
        min-height: 48px;
        text-align: left;
      }

      .choice-button.active {
        background: var(--warning);
        color: #1a1000;
      }

      details {
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }

      summary {
        min-height: 38px;
        cursor: pointer;
      }

      .sticky-actions {
        position: sticky;
        bottom: 0;
        margin: 16px 0 0;
        padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
        background: rgba(15, 20, 17, 0.96);
        border-top: 1px solid var(--line);
      }

      .sticky-actions button {
        width: 100%;
      }

      @media (max-width: 360px) {
        .page,
        nav {
          padding-left: 12px;
          padding-right: 12px;
        }

        .set-row,
        .target-grid,
        .stat-grid,
        .bar-row {
          grid-template-columns: 1fr;
        }

        .exercise-guidance {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="#today">今日训练</a>
      <a href="#detail">训练详情</a>
      <a href="#record">训练中</a>
      <a href="#history">历史</a>
      <a href="#profile">档案</a>
      <a href="#nutrition">补剂</a>
      <a href="#backup">备份</a>
      <a href="#analytics">分析</a>
    </nav>
    <main id="app"></main>
    <script type="module" src="./main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
